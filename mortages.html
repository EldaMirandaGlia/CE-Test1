<!DOCTYPE html>
<html lang="en">
<!-- (El <head> es exactamente igual al de index.html) -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Bank - Mortgages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { purple: '#6B21A8', green: '#15803D', light: '#F3F4F6' } } } } }
    </script>
</head>
<body class="bg-brand-light font-sans text-gray-800">

    <nav class="bg-brand-purple text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Mock Bank</h1>
            <ul class="flex space-x-6">
                <li><a href="index.html" class="hover:text-brand-green font-semibold">Home</a></li>
                <li><a href="credit-cards.html" class="hover:text-brand-green font-semibold">Credit Cards</a></li>
                <li><a href="payroll.html" class="hover:text-brand-green font-semibold">Payroll</a></li>
                <!-- Nota que ahora 'Mortgages' tiene el subrayado indicando la página actual -->
                <li><a href="mortgages.html" class="hover:text-brand-green font-semibold underline">Mortgages</a></li>
                <li><a href="escalations.html" class="hover:text-brand-green font-semibold">Escalations</a></li>
                <li><a href="fraud.html" class="text-red-300 hover:text-red-100 font-bold">Fraud</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Area CAMBIADO -->
    <main class="container mx-auto mt-8 p-6 bg-white rounded-lg shadow-sm border-t-4 border-brand-green">
        <h2 class="text-3xl font-bold text-brand-purple mb-4">Mortgage Solutions</h2>
        <p class="text-lg">Find the perfect home loan for your needs.</p>
        <p class="mt-4 text-sm text-gray-500">URL Actual: <span id="current-url-display"></span></p>
    </main>

    <!-- El script de Business Rules se mantiene igual para que se evalúe en cada carga -->
    <script>
        document.getElementById('current-url-display').textContent = window.location.pathname;
        const businessRules = [
            {
                name: "High-Value Mortgage Assistance",
                regex: /mortgages\.html/i, // <--- Esta regla hará "match" en esta página
                action: () => {
                    console.log("🔥 BUSINESS RULE: Mortgage page detected.");
                    setTimeout(() => alert("GLIA RULE TRIGGERED: Chat with a Mortgage Specialist!"), 500);
                }
            },
            {
                name: "Fraud Urgent Escalation",
                regex: /(fraud|escalations)\.html/i,
                action: () => {
                    console.log("🚨 BUSINESS RULE: Fraud or Escalation page detected.");
                    setTimeout(() => alert("GLIA RULE TRIGGERED: Priority Routing Enabled."), 500);
                }
            }
        ];

        function evaluateRules() {
            const currentPath = window.location.pathname;
            businessRules.forEach(rule => {
                if (rule.regex.test(currentPath)) {
                    rule.action();
                }
            });
        }
        window.onload = evaluateRules;
    </script>
</body>
</html>
