<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://api.beta.glia.com/salemove_integration.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Bank - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#6B21A8', // Tailwind Purple 800
                            green: '#15803D',  // Tailwind Green 700
                            light: '#F3F4F6'   // Off-white/gray for background
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light font-sans text-gray-800">

    <!-- Navigation Bar -->
    <nav class="bg-brand-purple text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Mock Bank</h1>
            <ul class="flex space-x-6">
                <!-- Enlaces reales a otras páginas -->
                <li><a href="index.html" class="hover:text-brand-green font-semibold underline">Home</a></li>
                <li><a href="credit-cards.html" class="hover:text-brand-green font-semibold">Credit Cards</a></li>
                <li><a href="payroll.html" class="hover:text-brand-green font-semibold">Payroll</a></li>
                <li><a href="mortgages.html" class="hover:text-brand-green font-semibold">Mortgages</a></li>
                <li><a href="escalations.html" class="hover:text-brand-green font-semibold">Escalations</a></li>
                <li><a href="fraud.html" class="text-red-300 hover:text-red-100 font-bold">Fraud</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container mx-auto mt-8 p-6 bg-white rounded-lg shadow-sm border-t-4 border-brand-green">
        <h2 class="text-3xl font-bold text-brand-purple mb-4">Welcome to Mock Bank</h2>
        <p class="text-lg">Manage your finances with confidence. Select a product from the menu above.</p>
        <p class="mt-4 text-sm text-gray-500">URL Actual: <span id="current-url-display"></span></p>
    </main>

    <!-- Motor de Reglas de Negocio Simulado -->
    <script>
        // 1. Mostrar la URL actual (para propósitos educativos y de prueba)
        document.getElementById('current-url-display').textContent = window.location.pathname;

        // 2. Definir las reglas basadas en RegEx contra la URL
        const businessRules = [
            {
                name: "High-Value Mortgage Assistance",
                regex: /mortgages\.html/i,
                action: () => {
                    console.log("🔥 BUSINESS RULE: Mortgage page detected.");
                    setTimeout(() => alert("GLIA RULE TRIGGERED: Chat with a Mortgage Specialist!"), 500);
                }
            },
            {
                name: "Fraud Urgent Escalation",
                regex: /(fraud|escalations)\.html/i,
                action: () => {
                    console.log("🚨 BUSINESS RULE: Fraud or Escalation page detected.");
                    setTimeout(() => alert("GLIA RULE TRIGGERED: Priority Routing Enabled."), 500);
                }
            }
        ];

        // 3. Evaluar la ruta actual
        function evaluateRules() {
            const currentPath = window.location.pathname;
            console.log(`Evaluando reglas para la URL: ${currentPath}`);
            
            businessRules.forEach(rule => {
                if (rule.regex.test(currentPath)) {
                    rule.action();
                }
            });
        }

        // Ejecutar las reglas tan pronto como la página cargue
        window.onload = evaluateRules;
    </script>
</body>
</html>
